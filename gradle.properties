# ===========================================================
# Gradle 全局参数
# ===========================================================

# JVM 内存：给 Gradle 4G，避免大项目编译 OOM
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 并行构建，加速多模块
org.gradle.parallel=true

# 配置缓存，二次构建更快
org.gradle.configuration-cache=true

# 守护进程，保持 JVM 常驻，开发更快
org.gradle.daemon=true

# ----- AndroidX 强制开关（必须为 true，否则用不了现代库）-----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ----- Kotlin 代码风格 -----
kotlin.code.style=official

# Avoid Kotlin daemon incremental-cache races when Android Studio and Gradle overlap.
# In-process compilation is slower but keeps builds deterministic on this project.
kotlin.compiler.execution.strategy=in-process

# ----- 仅生成构建产物用到的资源 ID，减小 APK 体积 -----
android.nonFinalResIds=true
android.suppressUnsupportedCompileSdk=36
